services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TREELINE_WARNING_ACCESS_USERNAME: ${TREELINE_WARNING_ACCESS_USERNAME:?required}
      TREELINE_WARNING_ACCESS_PASSWORD: ${TREELINE_WARNING_ACCESS_PASSWORD:?required}
      TREELINE_WARNING_DATABASE_PATH: /app/data/prediction_history.db
      TREELINE_WARNING_TEMPORAL_MODEL_PATH: /app/models/temporal_attention.npz
      TREELINE_WARNING_SPECIES_GROWTH_MODEL_PATH: /app/models/species_growth.json
      TREELINE_WARNING_TRAINING_OUTPUT_DIR: /app/models/trained
      TREELINE_WARNING_WEB_INDEX_PATH: /app/web/templates/index.html
    expose:
      - "8010"
    volumes:
      - treeline_data:/app/data
      - treeline_trained_models:/app/models/trained
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - internal

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?required}
      TLS_EMAIL: ${TLS_EMAIL:?required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:

volumes:
  treeline_data:
  treeline_trained_models:
  caddy_data:
  caddy_config:
