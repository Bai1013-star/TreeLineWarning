[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "treeline-warning"
version = "0.1.0"
description = "Tree-line clearance analysis contracts and pipeline scaffolding."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "Pillow>=12.3,<13",
    "laspy==2.7.0",
    "lazrs==0.8.2",
    "numpy>=1.26,<3",
    "onnxruntime>=1.22,<2",
    "openpyxl>=3.1",
    "psutil>=5.9,<8",
    "pyproj>=3.6,<4",
    "pyshp>=2.3,<3",
    "python-multipart>=0.0.9,<1",
    "scipy>=1.12,<2",
    "plotly>=6.9",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]
desktop = [
    "pyinstaller>=6,<7",
    "pywebview>=5.4,<6",
]

[tool.setuptools.packages.find]
include = ["algorithms*", "api*", "core*", "desktop*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["algorithms", "core", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
