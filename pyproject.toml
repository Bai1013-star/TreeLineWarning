[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "treeline-warning"
version = "0.1.0"
description = "Tree-line clearance analysis contracts and pipeline scaffolding."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "laspy>=2.5,<3",
    "numpy>=1.26,<3",
    "openpyxl>=3.1,<4",
    "plotly>=5.20,<7",
    "psutil>=5.9,<8",
    "python-multipart>=0.0.9,<1",
    "scipy>=1.12,<2",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "streamlit>=1.33,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["algorithms*", "api*", "core*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["algorithms", "core", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
