[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "treeline-warning"
version = "0.1.0"
description = "Tree-line clearance analysis contracts and pipeline scaffolding."
requires-python = ">=3.10"
dependencies = [
    "Pillow>=12.3",
    "laspy==2.7.0",
    "plotly>=6.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["algorithms", "core", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
